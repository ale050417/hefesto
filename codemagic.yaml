# Compilación de la app de iPhone de Hefesto 3D en Codemagic (https://codemagic.io).
#
# iOS solo se compila en una Mac: Codemagic presta una en la nube. Este archivo
# le dice qué hacer con la carpeta `mobile/` (la app Flutter): la revisa, la
# firma con la cuenta de Apple Developer y la sube a TestFlight.
#
# Usa el MISMO esquema que ya funciona para Fadely (2026-11-14):
#   - la integración de App Store Connect `fadely_asc`, que ya está cargada en
#     Codemagic (la clave es de la cuenta de Apple, sirve para cualquier app);
#   - el certificado de distribución que ya está en Codemagic → Code signing
#     identities. Lo único nuevo es el perfil de aprovisionamiento de ESTA app
#     (`ar.com.hefesto3d.hefesto`): el paso a paso está en `mobile/README.md`,
#     sección "iPhone".
#
# Disparo MANUAL (como Fadely): la mayoría de los commits son de la web y no
# tocan `mobile/`; compilar iOS en cada uno gastaría minutos sin necesidad.
#
# La versión visible (1.0.0) sale de `mobile/pubspec.yaml`; el número de
# compilación lo pone Codemagic y sube solo en cada corrida.

workflows:
  hefesto-ios:
    name: Hefesto 3D · iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [] # sin disparo automático — ver el porqué arriba
    integrations:
      app_store_connect: fadely_asc
    environment:
      # La misma versión con la que se desarrolla y se prueba la app.
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ar.com.hefesto3d.hefesto
    scripts:
      - name: Dependencias de Flutter
        script: |
          cd mobile
          flutter pub get

      - name: Análisis y pruebas (frena acá si hay algo roto, antes de gastar minutos de build de iOS)
        script: |
          cd mobile
          flutter analyze
          flutter test

      - name: Perfiles de firma del proyecto Xcode
        script: |
          xcode-project use-profiles

      - name: Compilar el .ipa
        script: |
          cat "$HOME/export_options.plist"
          cd mobile
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Sube el .ipa a TestFlight con la integración fadely_asc. El envío a
    # revisión de la App Store se hace a mano desde App Store Connect cuando la
    # ficha esté completa.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # --- Alta de la firma de iOS: se corre UNA sola vez --------------------------
  # Registra en la cuenta de Apple el identificador de la app (con la capacidad
  # "Sign In with Apple") y crea su perfil de App Store con los certificados de
  # distribución que ya existen. Después hay que traer ese perfil a Codemagic:
  # Teams → Code signing identities → iOS provisioning profiles → Fetch profiles.
  # Se puede volver a correr sin problema: lo que ya existe no se toca.
  hefesto-ios-alta:
    name: Hefesto 3D · iOS · alta de la firma (una sola vez)
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events: []
    integrations:
      app_store_connect: fadely_asc
    environment:
      vars:
        BUNDLE_ID: ar.com.hefesto3d.hefesto
        PROFILE_NAME: Hefesto 3D App Store
    scripts:
      - name: Identificador de la app, capacidad y perfil de App Store
        script: |
          set -e
          first_id() { python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else [d]; print(d[0].get('id','') if d else '')"; }
          all_ids() { python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else [d]; print(' '.join(x.get('id','') for x in d))"; }

          echo "== 1. Identificador $BUNDLE_ID"
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | first_id)
          if [ -z "$BID" ]; then
            BID=$(app-store-connect bundle-ids create "$BUNDLE_ID" --name "Hefesto 3D" --platform IOS --json | first_id)
            echo "Creado: $BID"
          else
            echo "Ya existía: $BID"
          fi
          [ -n "$BID" ] || { echo "No se pudo obtener el identificador."; exit 1; }

          echo "== 2. Capacidad Sign In with Apple"
          app-store-connect bundle-ids enable-capabilities "$BID" --capability "Sign In with Apple"             || echo "(ya estaba habilitada, o no se pudo: revisar arriba)"

          echo "== 3. Certificados de distribución de la cuenta"
          CERTS=$(app-store-connect certificates list --type DISTRIBUTION --json | all_ids)
          if [ -z "$CERTS" ]; then
            CERTS=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json | all_ids)
          fi
          [ -n "$CERTS" ] || { echo "La cuenta no tiene certificados de distribución."; exit 1; }
          echo "Certificados: $CERTS"

          echo "== 4. Perfil de App Store"
          EXISTING=$(app-store-connect bundle-ids profiles "$BID" --json 2>/dev/null | all_ids || true)
          if [ -n "$EXISTING" ]; then
            echo "El identificador ya tiene perfil(es): $EXISTING — no se crea otro."
          else
            app-store-connect profiles create "$BID" --certificate-ids $CERTS --type IOS_APP_STORE --name "$PROFILE_NAME" --save
          fi
          echo "Listo. Falta traer el perfil a Codemagic (Fetch profiles)."
