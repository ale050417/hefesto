# Compilación de la app de iPhone en Codemagic (https://codemagic.io).
#
# iOS solo se compila en una Mac: Codemagic presta una en la nube. Este archivo
# le dice qué hacer con la carpeta `mobile/` (la app Flutter): la prueba, la
# firma con la cuenta de Apple Developer y la sube a TestFlight.
#
# Lo que hay que cargar UNA vez en Codemagic (el paso a paso está en
# `mobile/README.md`, sección "iPhone"):
#   1. Teams → Integrations → App Store Connect: una API key llamada
#      `hefesto_asc` (rol "App Manager").
#   2. Environment variables, grupo `ios_signing`: la variable secreta
#      `CERTIFICATE_PRIVATE_KEY` (el contenido del archivo
#      `hefesto-ios-cert-key.pem`).
#
# La versión visible (1.0.0) sale de `mobile/pubspec.yaml`; el número de
# compilación lo pone Codemagic y sube solo en cada corrida.

workflows:
  ios-testflight:
    name: iPhone · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile
    integrations:
      app_store_connect: hefesto_asc
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: ar.com.hefesto3d.hefesto
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Análisis y pruebas
        script: |
          flutter analyze
          flutter test
      - name: Firma · llavero temporal
        script: keychain initialize
      - name: Firma · certificado y perfil de App Store
        # Los crea en la cuenta de Apple si todavía no existen.
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Firma · instalar el certificado
        script: keychain add-certificates
      - name: Firma · aplicar los perfiles al proyecto
        script: xcode-project use-profiles
      - name: Compilar el .ipa
        script: |
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Queda disponible en TestFlight; el envío a revisión de la App Store
        # se hace a mano desde App Store Connect cuando la ficha esté completa.
        submit_to_testflight: true
