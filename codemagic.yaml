# Compilación de la app de iPhone de Hefesto 3D en Codemagic (https://codemagic.io).
#
# iOS solo se compila en una Mac: Codemagic presta una en la nube. Este archivo
# le dice qué hacer con la carpeta `mobile/` (la app Flutter): la revisa, la
# firma con la cuenta de Apple Developer y la sube a TestFlight.
#
# Usa el MISMO esquema que ya funciona para Fadely (2026-11-14):
#   - la integración de App Store Connect `fadely_asc`, que ya está cargada en
#     Codemagic (la clave es de la cuenta de Apple, sirve para cualquier app);
#   - el certificado de distribución que ya está en Codemagic → Code signing
#     identities. Lo único nuevo es el perfil de aprovisionamiento de ESTA app
#     (`ar.com.hefesto3d.hefesto`), que crea el workflow `hefesto-ios-alta`
#     de más abajo. El paso a paso está en `mobile/README.md`, sección "iPhone".
#
# Disparo MANUAL (como Fadely): la mayoría de los commits son de la web y no
# tocan `mobile/`; compilar iOS en cada uno gastaría minutos sin necesidad.
#
# La versión visible (1.0.0) sale de `mobile/pubspec.yaml`; el número de
# compilación lo pone Codemagic y sube solo en cada corrida.

workflows:
  hefesto-ios:
    name: Hefesto 3D · iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [] # sin disparo automático — ver el porqué arriba
    integrations:
      app_store_connect: fadely_asc
    environment:
      # La misma versión con la que se desarrolla y se prueba la app.
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ar.com.hefesto3d.hefesto
    scripts:
      - name: Dependencias de Flutter
        script: |
          cd mobile
          flutter pub get

      - name: Análisis y pruebas (frena acá si hay algo roto, antes de gastar minutos de build de iOS)
        script: |
          cd mobile
          flutter analyze
          flutter test

      - name: Perfiles de firma del proyecto Xcode
        script: |
          xcode-project use-profiles

      - name: Compilar el .ipa
        script: |
          cat "$HOME/export_options.plist"
          cd mobile
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Sube el .ipa a TestFlight con la integración fadely_asc. El envío a
    # revisión de la App Store se hace a mano desde App Store Connect cuando la
    # ficha esté completa.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # --- Alta de la firma de iOS: se corre UNA sola vez --------------------------
  # Registra en la cuenta de Apple el identificador de la app con la capacidad
  # "Sign In with Apple" y crea su perfil de App Store con el certificado de
  # distribución que ya existe. Después hay que traer ese perfil a Codemagic:
  # Teams → Code signing identities → iOS provisioning profiles → Fetch profiles.
  #
  # Habla directo con la API de App Store Connect: la herramienta de Codemagic
  # no manda la configuración que Apple exige para "Sign In with Apple"
  # (409 "Please select at least one configuration", 2026-11-14).
  # Se puede volver a correr: lo que ya está bien no se toca.
  hefesto-ios-alta:
    name: Hefesto 3D · iOS · alta de la firma (una sola vez)
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events: []
    integrations:
      app_store_connect: fadely_asc
    environment:
      vars:
        BUNDLE_ID: ar.com.hefesto3d.hefesto
        APP_NAME: Hefesto 3D
        PROFILE_NAME: Hefesto 3D App Store
    scripts:
      - name: Identificador, Sign In with Apple y perfil de App Store
        script: |
          pip3 install --quiet --disable-pip-version-check "pyjwt[crypto]" requests
          python3 - <<'PY'
          import json, os, sys, time
          import jwt, requests

          env = {n: os.environ.get(n, "") for n in (
              "APP_STORE_CONNECT_ISSUER_ID", "APP_STORE_CONNECT_KEY_IDENTIFIER", "APP_STORE_CONNECT_PRIVATE_KEY")}
          faltan = [n for n, v in env.items() if not v]
          if faltan:
              sys.exit(f"Faltan variables de la integración: {faltan}")
          key = env["APP_STORE_CONNECT_PRIVATE_KEY"]
          # Por si la clave llega con los saltos de línea escritos como "\n".
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          now = int(time.time())
          token = jwt.encode(
              {"iss": env["APP_STORE_CONNECT_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": env["APP_STORE_CONNECT_KEY_IDENTIFIER"], "typ": "JWT"})
          API = "https://api.appstoreconnect.apple.com/v1"
          H = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method, path, body=None):
              r = requests.request(method, API + path, headers=H, data=json.dumps(body) if body else None, timeout=60)
              if r.status_code >= 300:
                  sys.exit(f"{method} {path} -> {r.status_code}: {r.text[:1000]}")
              return r.json() if r.text else {}

          bundle, app_name, profile_name = os.environ["BUNDLE_ID"], os.environ["APP_NAME"], os.environ["PROFILE_NAME"]

          print("== 1. Identificador", bundle)
          found = [b for b in call("GET", f"/bundleIds?filter[identifier]={bundle}&limit=200")["data"]
                   if b["attributes"]["identifier"] == bundle]
          if found:
              bid = found[0]["id"]
              print("Ya existía:", bid)
          else:
              bid = call("POST", "/bundleIds", {"data": {"type": "bundleIds", "attributes": {
                  "identifier": bundle, "name": app_name, "platform": "IOS"}}})["data"]["id"]
              print("Creado:", bid)

          print("== 2. Sign In with Apple")
          caps = [c["attributes"]["capabilityType"]
                  for c in call("GET", f"/bundleIds/{bid}/bundleIdCapabilities?limit=200")["data"]]
          print("Capacidades:", caps)
          changed = False
          if "APPLE_ID_AUTH" in caps:
              print("Ya estaba habilitada.")
          else:
              call("POST", "/bundleIdCapabilities", {"data": {
                  "type": "bundleIdCapabilities",
                  "attributes": {"capabilityType": "APPLE_ID_AUTH", "settings": [
                      {"key": "APPLE_ID_AUTH_APP_CONSENT", "options": [{"key": "PRIMARY_APP_CONSENT"}]}]},
                  "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid}}}}})
              changed = True
              print("Habilitada (app principal).")

          print("== 3. Perfil de App Store")
          store = [p for p in call("GET", f"/bundleIds/{bid}/profiles?limit=200")["data"]
                   if p["attributes"]["profileType"] == "IOS_APP_STORE"]
          valid = [p for p in store if p["attributes"]["profileState"] == "ACTIVE"]
          if valid and not changed:
              print("Ya hay un perfil válido:", [p["attributes"]["name"] for p in valid])
          else:
              # Un perfil creado antes de habilitar la capacidad no la incluye:
              # se borra y se vuelve a crear (son de ESTA app, no de Fadely).
              for p in store:
                  call("DELETE", f"/profiles/{p['id']}")
                  print("Perfil viejo borrado:", p["attributes"]["name"], p["id"])
              certs = [c["id"] for c in call(
                  "GET", "/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION&limit=200")["data"]]
              if not certs:
                  sys.exit("La cuenta no tiene certificados de distribución.")
              print("Certificados:", certs)
              prof = call("POST", "/profiles", {"data": {
                  "type": "profiles",
                  "attributes": {"name": profile_name, "profileType": "IOS_APP_STORE"},
                  "relationships": {
                      "bundleId": {"data": {"type": "bundleIds", "id": bid}},
                      "certificates": {"data": [{"type": "certificates", "id": c} for c in certs]}}}})["data"]
              print("Perfil creado:", prof["attributes"]["name"], prof["id"], prof["attributes"]["profileState"])
          print("Listo. Falta traer el perfil a Codemagic (Fetch profiles).")
          PY
